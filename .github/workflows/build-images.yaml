name: Build Container Images

on:
  push:
    tags:
      - "image/v*"
    paths-ignore:
      - "charts/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "charts/**"
env:
  IMAGES: docker.io/hapiproject/hapi
  PLATFORMS: linux/amd64,linux/arm64/v8

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Container meta for default (distroless) image
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=match,pattern=image/(.*),group=1,enable=${{github.event_name != 'pull_request'}}
           

      - name: Container meta for tomcat image
        id: docker_tomcat_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=match,pattern=image/(.*),group=1,enable=${{github.event_name != 'pull_request'}}
          flavor: |
            suffix=-tomcat,onlatest=true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # A successful build does not mean the container starts, so each image is started once before anything is
      # pushed. The multi-platform builds below reuse these linux/amd64 layers from the builder.
      - name: Build default image for the smoke test
        uses: docker/build-push-action@v5
        with:
          cache-from: type=local,src=/tmp/.buildx-cache
          load: true
          tags: hapi-smoke-test:default
          platforms: linux/amd64
          target: default

      - name: Build tomcat image for the smoke test
        uses: docker/build-push-action@v5
        with:
          cache-from: type=local,src=/tmp/.buildx-cache
          load: true
          tags: hapi-smoke-test:tomcat
          platforms: linux/amd64
          target: tomcat

      - name: Smoke test the images
        env:
          TIMEOUT_MINUTES: 30
          # A start that takes longer than this still passes, but is reported as a warning on the run.
          WARN_AFTER_MINUTES: 5
        run: |
          smoke_test() {
            local target="$1"
            local name="hapi-smoke-test-$target"
            local start=$SECONDS
            local deadline=$((SECONDS + TIMEOUT_MINUTES * 60))
            docker run -d --name "$name" -p 8080:8080 "hapi-smoke-test:$target"
            # --max-time keeps a request that hangs during startup from outlasting the deadline.
            until curl -fs --max-time 5 http://localhost:8080/actuator/health > /dev/null; do
              if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != "true" ]; then
                echo "$target: the container stopped before it became healthy."
                return 1
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "$target: the container did not become healthy within $TIMEOUT_MINUTES minutes."
                return 1
              fi
              sleep 5
            done
            local took=$((SECONDS - start))
            echo "$target: healthy after $took s:"
            if [ "$took" -gt $((WARN_AFTER_MINUTES * 60)) ]; then
              echo "::warning title=Slow container start::The $target image took $took s to become healthy (more than $WARN_AFTER_MINUTES minutes)."
            fi
            curl -fsS --max-time 5 http://localhost:8080/actuator/health
            echo
            curl -fsS --max-time 120 -o /dev/null -w "$target: GET /fhir/metadata: %{http_code}\n" \
              http://localhost:8080/fhir/metadata
          }
          smoke_test default
          docker exec hapi-smoke-test-default java -cp /app HealthCheck
          docker stop hapi-smoke-test-default > /dev/null
          smoke_test tomcat
          docker stop hapi-smoke-test-tomcat > /dev/null

      - name: Show the container logs
        if: always()
        run: |
          for name in hapi-smoke-test-default hapi-smoke-test-tomcat; do
            echo "::group::$name"
            docker logs "$name" || true
            echo "::endgroup::"
          done

      - name: Build and push default (distroless) image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}
          target: default

      - name: Build and push tomcat image
        id: docker_build_tomcat
        uses: docker/build-push-action@v5
        with:
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_tomcat_meta.outputs.tags }}
          labels: ${{ steps.docker_tomcat_meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}
          target: tomcat
