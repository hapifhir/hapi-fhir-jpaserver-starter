name: Build Container Images

on:
  push:
    tags:
      - "image/v*"
    paths-ignore:
      - "charts/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "charts/**"
env:
  IMAGES: docker.io/hapiproject/hapi
  PLATFORMS: linux/amd64,linux/arm64/v8

jobs:
  # Starts each image once before anything is pushed: a successful build does not mean the container starts.
  smoke-test:
    name: Smoke test (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [default, tomcat]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image for linux/amd64
        uses: docker/build-push-action@v5
        with:
          load: true
          tags: hapi-smoke-test:${{ matrix.target }}
          platforms: linux/amd64
          target: ${{ matrix.target }}

      - name: Start the container and wait until it is healthy
        env:
          IMAGE: hapi-smoke-test:${{ matrix.target }}
          TIMEOUT_MINUTES: 20
        run: |
          docker run -d --name hapi-smoke-test -p 8080:8080 "$IMAGE"
          deadline=$((SECONDS + TIMEOUT_MINUTES * 60))
          # --max-time keeps a request that hangs during startup from outlasting the deadline.
          until curl -fs --max-time 5 http://localhost:8080/actuator/health > /dev/null; do
            if [ "$(docker inspect -f '{{.State.Running}}' hapi-smoke-test)" != "true" ]; then
              echo "The container stopped before it became healthy."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "The container did not become healthy within $TIMEOUT_MINUTES minutes."
              exit 1
            fi
            sleep 5
          done
          echo "Healthy after $SECONDS s:"
          curl -fsS --max-time 5 http://localhost:8080/actuator/health
          echo
          curl -fsS --max-time 120 -o /dev/null -w 'GET /fhir/metadata: %{http_code}\n' http://localhost:8080/fhir/metadata

      - name: Run the image's HealthCheck
        if: matrix.target == 'default'
        run: docker exec hapi-smoke-test java -cp /app HealthCheck

      - name: Show the container log
        if: always()
        run: docker logs hapi-smoke-test || true

  build:
    name: Build
    needs: smoke-test
    runs-on: ubuntu-24.04
    steps:
      - name: Container meta for default (distroless) image
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=match,pattern=image/(.*),group=1,enable=${{github.event_name != 'pull_request'}}
           

      - name: Container meta for tomcat image
        id: docker_tomcat_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=match,pattern=image/(.*),group=1,enable=${{github.event_name != 'pull_request'}}
          flavor: |
            suffix=-tomcat,onlatest=true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push default (distroless) image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}
          target: default

      - name: Build and push tomcat image
        id: docker_build_tomcat
        uses: docker/build-push-action@v5
        with:
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_tomcat_meta.outputs.tags }}
          labels: ${{ steps.docker_tomcat_meta.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}
          target: tomcat
