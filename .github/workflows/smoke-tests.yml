# This workflow will build the Java project with Maven and peform IntelliJ smoke tests
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Smoke Tests

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - "charts/**"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "charts/**"

jobs:
  build_and_smoke_test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: zulu

      - name: Build with Maven
        env:
          MAVEN_OPTS: -Xms256m -Xmx3g -XX:+UseG1GC
        run: mvn -B package --file pom.xml -Dmaven.test.skip=true

      - name: Docker Pull HTTP client
        run: docker pull jetbrains/intellij-http-client

      - name: Start server with jetty
        run: |
          mkdir -p logs
          mvn -P jetty spring-boot:run | tee logs/server.log &
          sleep 80

      - name: Execute smoke tests
        run: docker run --rm -v $PWD:/workdir --add-host host.docker.internal:host-gateway jetbrains/intellij-http-client -D src/test/smoketest/plain_server.http --env-file src/test/smoketest/http-client.env.json --env default

      - name: Set up Node.js for the MCP Inspector
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the MCP tool schemas with the MCP Inspector
        run: |
          # Fails on any finding of the Inspector's schema portability check, warnings included (with --strict, only
          # errors change the exit code). The version is pinned, so that a rule added in a later Inspector release
          # does not fail the build without a change here.
          npx -y @modelcontextprotocol/inspector@2.16.0 --cli http://localhost:8080/mcp/messages --transport http \
            --method tools/list --strict > logs/mcp-tools.json 2> logs/mcp-schema-lint.txt && status=0 || status=$?
          cat logs/mcp-schema-lint.txt
          if [ "$status" -ne 0 ] || grep -qE '^(Warning|Error): tool' logs/mcp-schema-lint.txt; then
            echo "::error::The MCP Inspector reports problems in the MCP tool schemas (exit code $status)"
            exit 1
          fi
          echo "No findings in the MCP tool schemas."

      - name: Call an MCP tool with the MCP Inspector
        run: |
          # The Inspector is a JavaScript client, like most MCP clients. The tool result must carry the URLs that a
          # REST client gets, with port and FHIR servlet path.
          npx -y @modelcontextprotocol/inspector@2.16.0 --cli http://localhost:8080/mcp/messages --transport http \
            --method tools/call --tool-name create-fhir-resource --tool-arg resourceType=Patient \
            --tool-arg 'resource={"resourceType":"Patient"}' > logs/mcp-create.json
          location=$(jq -r '.content[0].text | fromjson | .location' logs/mcp-create.json)
          echo "Location: $location"
          case "$location" in
            http://localhost:8080/fhir/Patient/*/_history/1) ;;
            *)
              echo "::error::Unexpected Location in the MCP tool result: $location"
              exit 1
              ;;
          esac

      - name: Show last server logs
        if: always()
        run: |
          echo "===== Last 200 Lines of Server Log ====="
          tail -n 200 logs/server.log || true    

      - name: Highlight server errors
        if: always()
        run: |
          echo "===== Highlighted Server Errors ====="
          if grep 'ERROR' logs/server.log > /dev/null; then
            grep 'ERROR' logs/server.log | while read -r line; do
              echo "::error::${line}"
            done
          else
            echo "No errors found in server logs."
          fi

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: logs/server.log
